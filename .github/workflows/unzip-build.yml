name: Build Mizan APK

on:
workflow_dispatch:
push:
paths:
- '.github/workflows/unzip-build.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project
    run: |
      mkdir -p /tmp/mizan-project
      unzip -o MizanAndroidProject_CloudBuild.zip -d /tmp/mizan-project
      cp -r /tmp/mizan-project/. .

  - name: Build APK
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Mizan-debug-APK
      path: app/build/outputs/apk/debug/app-debug.apk
